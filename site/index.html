<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pista Aberta | Fórmula 1 em Português</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">🏎️ PISTA <span>ABERTA</span></a>
            <div class="nav-links">
                <a href="index.html" class="ativo">Início & Notícias</a>
                <a href="pilotos.html">Equipas & Pilotos</a>
                <a href="historico.html">Temporadas Passadas</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-conteudo">
            <span class="etiqueta-live">Próxima Sessão em Pista</span>
            <h1 id="tituloProximo">Grande Prémio de Fórmula 1</h1>
            <p id="subtituloProximo">A carregar horários oficiais (Hora de Lisboa)...</p>
            
            <div class="contador" id="contador">
                <div class="caixa-tempo"><span id="dias">00</span><small>Dias</small></div>
                <div class="caixa-tempo"><span id="horas">00</span><small>Horas</small></div>
                <div class="caixa-tempo"><span id="minutos">00</span><small>Min</small></div>
                <div class="caixa-tempo"><span id="segundos">00</span><small>Seg</small></div>
            </div>
        </div>
    </header>

    <main class="container">
        <h2 class="titulo-seccao">Fins de Semana de Corrida (Hora de Lisboa • DAZN)</h2>
        <div id="grelhaCorridas" class="grelha" style="margin-bottom: 50px;"></div>

        <h2 class="titulo-seccao">Últimas Notícias do Paddock</h2>
        <div id="grelhaNoticias" class="grelha"></div>
    </main>

    <script>
        async function iniciarPortal() {
            // 1. Carregar Calendário e Contagem Decrescente
            try {
                const resW = await fetch('data/weekends.json');
                const dadosW = await resW.json();
                const listaW = Array.isArray(dadosW) ? dadosW : (dadosW.weekends || []);

                const grelhaCorridas = document.getElementById('grelhaCorridas');
                const agora = new Date();
                let proximaSessao = null;

                listaW.slice(0, 3).forEach(gp => {
                    const cartao = document.createElement('article');
                    cartao.className = 'cartao';

                    const sessoes = gp.sessions || [];
                    const htmlSessoes = sessoes.map(s => {
                        const dataS = s.start ? new Date(s.start) : null;
                        if (dataS && dataS > agora && !proximaSessao) {
                            proximaSessao = { nome: `${s.name} • ${gp.name}`, data: dataS };
                        }
                        const horaTxt = dataS ? dataS.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }) : 'A confirmar';
                        const diaTxt = dataS ? dataS.toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: 'short' }) : '';
                        return `<div class="linha-sessao"><span>${s.name}</span><span>${diaTxt} <strong>${horaTxt}</strong></span></div>`;
                    }).join('');

                    cartao.innerHTML = `
                        <div class="faixa-equipa" style="background: var(--vermelho-f1);"></div>
                        <div class="cartao-corpo">
                            <small style="color: var(--texto-suave); text-transform: uppercase;">${gp.circuit || ''}</small>
                            <h3 style="font-size: 22px; margin-bottom: 15px;">${gp.name}</h3>
                            ${htmlSessoes}
                        </div>
                    `;
                    grelhaCorridas.appendChild(cartao);
                });

                if (proximaSessao) {
                    document.getElementById('tituloProximo').textContent = proximaSessao.nome;
                    document.getElementById('subtituloProximo').textContent = proximaSessao.data.toLocaleDateString('pt-PT', {
                        weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
                    }) + ' (Hora de Lisboa)';

                    setInterval(() => {
                        const diff = proximaSessao.data - new Date();
                        if (diff <= 0) return;
                        document.getElementById('dias').textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
                        document.getElementById('horas').textContent = String(Math.floor((diff / 3600000) % 24)).padStart(2, '0');
                        document.getElementById('minutos').textContent = String(Math.floor((diff / 60000) % 60)).padStart(2, '0');
                        document.getElementById('segundos').textContent = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
                    }, 1000);
                }
            } catch (e) { console.error(e); }

            // 2. Carregar Notícias
            try {
                const resN = await fetch('data/news.json');
                const dadosN = await resN.json();
                const listaN = Array.isArray(dadosN) ? dadosN : (dadosN.items || dadosN.articles || []);
                const grelhaNoticias = document.getElementById('grelhaNoticias');

                listaN.slice(0, 6).forEach(n => {
                    const cartao = document.createElement('article');
                    cartao.className = 'cartao';
                    const img = n.image || 'https://unsplash.com';
                    cartao.innerHTML = `
                        <img src="${img}" alt="F1" class="foto-piloto">
                        <div class="cartao-corpo">
                            <small style="color: var(--vermelho-f1); font-weight: bold;">${n.source || 'F1 NEWS'}</small>
                            <h3 style="margin: 8px 0 12px; font-size: 19px;">${n.title}</h3>
                            <a href="${n.link || n.url}" target="_blank" style="color: white; font-weight: bold; text-decoration: none;">Ler artigo completo →</a>
                        </div>
                    `;
                    grelhaNoticias.appendChild(cartao);
                });
            } catch (e) { console.error(e); }
        }
        iniciarPortal();
    </script>
</body>
</html>
