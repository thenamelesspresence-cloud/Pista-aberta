<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipas · Pista Aberta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<style>
/* cores base: garantem o fundo escuro mesmo que o equipas.css falhe ou esteja em cache */
:root{--team:#E10600;--bg:#0B0D10;--panel:#14181D;--panel2:#1B2128;--ink:#F2F4F6;--muted:#9AA4AE;--line:#262E36;color-scheme:dark}
html,body{background:#0B0D10;color:#F2F4F6}
</style>
<link rel="stylesheet" href="equipas.css?v=4">
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="logo disp" href="index.html#proxima"><i></i>Pista Aberta</a>
  <ul>
    <li><a class="l" href="index.html#proxima">Próxima</a></li>
    <li><a class="l" href="index.html#calendario">Calendário</a></li>
    <li><a class="l ativo" href="equipas.html">Equipas</a></li>
    <li><a class="l" href="index.html#noticias">Notícias</a></li>
  </ul>
</div></header>

<main class="wrap">
  <div class="page-head">
    <h1>Equipas</h1>
    <small>A grelha de 2026 · 11 equipas</small>
  </div>
  <div class="grid-equipas" id="grelha"></div>
</main>

<footer class="rodape"><div class="wrap">Site não oficial, sem ligação à Fórmula 1 nem às equipas. Os nomes e as marcas pertencem aos respetivos proprietários.</div></footer>

<script src="equipas-data.js?v=5"></script>
<script>
  var grelha = document.getElementById("grelha");
  EQUIPAS.forEach(function (t) {
    var card = document.createElement("a");
    card.className = "card-equipa";
    card.href = "equipa.html?equipa=" + t.slug;
    card.style.setProperty("--team", t.cor);

    var box = document.createElement("div");
    box.className = "logo-box";

    var nome = document.createElement("h2");
    nome.textContent = t.nome;

    var ver = document.createElement("span");
    ver.className = "ver";
    ver.textContent = "Ver equipa →";

    card.appendChild(box);
    card.appendChild(nome);
    card.appendChild(ver);
    grelha.appendChild(card);

    montarLogo(box, t.slug, t.nome);
  });
</script>
</body>
</html>
