name: Atualizar dados
on:
  schedule:
    - cron: "0 * * * *"   # de hora a hora
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
      - name: Guardar alterações
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "atualizador"
            git config user.email "atualizador@users.noreply.github.com"
            git add site/data
            git commit -m "Atualizar calendário e notícias"
            git push
          fi
